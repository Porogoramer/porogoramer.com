name: Backend Test and Lint
on:
  pull_request:
    types: [synchronize, opened]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  run-django-tests:
    if: ${{ startsWith(github.head_ref, 'backend/') || (github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
      - name: Setup Python
        uses: actions/setup-python@v5.2.0
        with: 
          python-version: '3.12.1'
      - name: Create environment, install dependencies, and run tests
        run: | 
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          cd porogo
          python manage.py test
      
  run-py-lint:
    if: ${{ startsWith(github.head_ref, 'backend/') || (github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
      - name: Setup Python
        uses: actions/setup-python@v5.2.0
        with: 
          python-version: '3.12.1'
      - name: Create environment, install dependencies, and run tests
        run: | 
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          djlint . --lint
          chmod +x lint.sh
          ./lint.sh
